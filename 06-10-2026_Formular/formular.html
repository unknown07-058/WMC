<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung Workshop</title>

<style>

    body {

        background-color:rgb(146, 146, 214);
        text-align: center;
    }



    .box {

    width: 20rem;
    padding: 1rem 1rem;
    margin: 1rem 1rem;
    margin: 1rem auto;
    border: 4px solid #000000;
    border-radius: 6%;
    background-color:rgb(189, 195, 240);

    }

</style>


</head>
<body>

    <h1>Registrierung für einen technischen Workshop</h1>

    <br>

    <div class="box">
        <h2>Fülle bitte aus !!</h2>

        <form action="mailto:GOE250894@spengergasse.at" method="post" enctype="text/plain">
        
      
        <label for="vorname">Vorname:</label><br>
        <input type="text" id="vorname" name="vorname" required>
        <br><br>

        <label for="nachname">Nachname:</label><br>
        <input type="text" id="nachname" name="nachname" required>
        <br><br>

        <label for="geburtsdatum">Geburtsdatum:</label><br>
        <input type="date" id="geburtsdatum" name="geburtsdatum" required> 
        <br><br>


        <p>Geschlecht:</p>
        <input type="radio" id="maennlich" name="geschlecht" value="maennlich">
        <label for="maennlich">Männlich</label>

        <input type="radio" id="weiblich" name="geschlecht" value="weiblich">
        <label for="weiblich">Weiblich</label>

        <input type="radio" id="divers" name="geschlecht" value="divers">
        <label for="divers">Divers</label>
        <br><br><br>

        <label for="ausbildung">Studium/Ausbildung:</label><br>
        <select id="ausbildung" name="ausbildung">
            <option value="keineAngabe" selected>Keine Angabe</option>
            <option value="IT">IT</option>
            <option value="Elektrotechnik">Elektrotechnik</option>
            <option value="Mechatronik">Mechatronik</option>
        </select>
        <br><br>



        <p>An welchen Tagen werden Sie den Workshop besuchen?</p>
        <input type="checkbox" id="tag1" name="workshop_tage" value="25.01.2027">
        <label for="tag1">25.01.2027</label>

        <input type="checkbox" id="tag2" name="workshop_tage" value="26.08.2027">
        <label for="tag2">26.08.2027</label>
        <br><br>


        <label for="stadt">Stadt:</label><br>
        <select id="stadt" name="stadt" multiple required>
            <option value="Wien">Wien</option>
            <option value="Salzburg">Salzburg</option>
            <option value="Burgenland">Burgenland</option>
            <option value="Burgenland">Tirol</option>

        </select>
        <br><br>



        <label for="kommentar">Haben Sie Fragen? Schreiben Sie uns:</label><br>
        <textarea id="kommentar" name="kommentar" placeholder="Hier schreiben!"></textarea>
        <br><br>


        <input type="submit" value="Formular abschicken">
        <input type="reset" value="Formular zurücksetzen">
<br> <br>
    </form>
    </div>
</body>
</html>
